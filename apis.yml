name: Material Depot
description: 'Material Depot is India''s design-first interior-materials marketplace and experience-centre
  network, headquartered in Bengaluru and founded in 2022. It helps homeowners, architects, interior
  designers, builders and contractors discover, compare, visualize and purchase interior-design materials
  — tiles, laminates, wall panels, plywood, wallpapers, flooring, sanitaryware and countertops — spanning
  300,000+ products across 1,000+ brands and 100+ categories. The company blends online discovery with
  physical experience centres in Bengaluru and Hyderabad, offering sample ordering, store-visit booking,
  free design consultations, video-call shopping, mix-and-match visualization, bulk/trade quotations and
  pan-India delivery. Backed by Accel, Material Depot operates a consumer/B2B web marketplace and does not
  currently publish a public developer API, SDK, or developer portal.'
